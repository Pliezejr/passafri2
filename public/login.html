<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Login — AfriPass</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topnav">
  <div class="container">
    <a class="brand" href="/"><span>AfriPass</span><span class="badge">BUSINESS PASSPORT</span></a>
    <nav class="links" id="nav-links"></nav>
  </div>
</header>

<main class="container" style="max-width:420px;">
  <h1>Business login</h1>
  <div id="alert-box"></div>
  <form id="login-form" class="card">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required>
    </div>
    <div class="form-actions">
      <button type="submit" id="submit-btn">Log in</button>
    </div>
  </form>
  <p class="muted">No account yet? <a href="/register.html">Register your business</a></p>
  <p class="muted" style="font-size:0.85rem;">AfriPass staff: <a href="/admin.html">Admin login</a></p>
</main>

<footer>AfriPass MVP demo</footer>

<script src="/js/app.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('alert-box');
  const btn = document.getElementById('submit-btn');
  showAlert(alertBox, null);
  btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    await Api.post('/api/login', {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    });
    window.location.href = '/dashboard.html';
  } catch (err) {
    showAlert(alertBox, err.message);
    btn.disabled = false; btn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
