<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>AfriPass</title>
  <meta name="description" content="Verify the business. Trust the transaction.">
  <meta name="theme-color" content="#0b2545">

  <!-- PWA / installability -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AfriPass">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body class="app-shell">
  <div id="offline-banner" class="offline-banner hidden">You're offline — showing cached info where available.</div>

  <header class="app-topbar">
    <button id="topbar-back" class="back hidden" aria-label="Back">←</button>
    <div id="topbar-title" class="title">AfriPass</div>
    <div id="topbar-action"></div>
  </header>

  <main id="app-content" class="app-content"></main>

  <nav id="app-tabbar" class="app-tabbar">
    <button data-tab="home"><span class="icon">🏠</span><span>Home</span></button>
    <button data-tab="scan"><span class="icon">📷</span><span>Scan</span></button>
    <button data-tab="account"><span class="icon">👤</span><span>Account</span></button>
    <button data-tab="admin"><span class="icon">🛡️</span><span>Admin</span></button>
  </nav>

  <script src="/js/app.js"></script>
  <script src="/js/mobile/app.js"></script>
</body>
</html>
